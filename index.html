<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>METROGNOME</title>
<meta name="description" content="Song BPM Finder & Metronome">
<meta name="theme-color" content="#e8ff47">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="METROGNOME">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #222;
    --accent: #e8ff47;
    --accent2: #ff4747;
    --text: #f0f0f0;
    --muted: #555;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container { width: 100%; max-width: 560px; position: relative; z-index: 1; }
  header { margin-bottom: 36px; }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(42px, 12vw, 68px);
    line-height: 0.9;
    letter-spacing: 2px;
    color: var(--accent);
    text-shadow: 4px 4px 0 rgba(232,255,71,0.15);
  }

  .tagline {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .search-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    display: block;
  }

  .search-row { display: flex; gap: 8px; margin-bottom: 10px; }

  .search-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 0;
    -webkit-appearance: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 18px;
    cursor: pointer;
    white-space: nowrap;
    border-radius: 0;
  }
  .btn:active { opacity: 0.75; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .status {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    min-height: 18px;
    margin-bottom: 20px;
  }
  .status.error   { color: var(--accent2); }
  .status.success { color: var(--accent); }

  .song-result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    padding: 14px 16px;
    margin-bottom: 28px;
    display: none;
    animation: slideIn 0.3s ease;
  }
  .song-result.visible { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .song-name { font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .song-meta { font-size: 11px; color: var(--muted); letter-spacing: 1px; }

  .bpm-section { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; }

  .bpm-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(80px, 22vw, 120px);
    line-height: 1;
    color: var(--accent);
    min-width: 160px;
  }

  .bpm-label {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .bpm-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }

  .bpm-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    width: 48px; height: 48px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .bpm-btn:active { border-color: var(--accent); color: var(--accent); }

  .bpm-slider {
    flex: 1;
    -webkit-appearance: none;
    height: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .bpm-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    background: var(--accent);
    cursor: pointer;
    border-radius: 0;
  }

  .beat-visualizer {
    display: flex; gap: 10px;
    margin-bottom: 28px;
    height: 32px; align-items: center;
  }

  .beat-dot {
    width: 10px; height: 10px;
    background: var(--border);
    flex-shrink: 0;
    transition: background 0.05s, box-shadow 0.05s, transform 0.05s;
  }
  .beat-dot.accent-beat { width: 14px; height: 14px; }
  .beat-dot.active {
    background: var(--accent);
    box-shadow: 0 0 12px rgba(232,255,71,0.8);
    transform: scale(1.4);
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: block;
  }

  .time-sig-options { display: flex; gap: 8px; margin-bottom: 28px; flex-wrap: wrap; }

  .time-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 10px 16px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .time-btn:active { border-color: var(--accent); color: var(--text); }
  .time-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(232,255,71,0.05); }

  hr { border: none; border-top: 1px solid var(--border); margin: 4px 0 22px; }

  .play-section { display: flex; gap: 12px; }

  .play-btn {
    flex: 1;
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 4px;
    padding: 20px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .play-btn:active, .play-btn.playing { background: var(--accent); color: #000; }

  .tap-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 14px 18px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tap-btn:active { border-color: var(--accent); }

  .flash {
    position: fixed; inset: 0;
    background: var(--accent);
    opacity: 0; pointer-events: none; z-index: 999;
    transition: opacity 0.05s;
  }
  .flash.beat { opacity: 0.04; }

  .spinner {
    display: inline-block;
    width: 10px; height: 10px;
    border: 2px solid var(--muted);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  .key-display {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 28px;
  }
  .key-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .key-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    color: var(--text);
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="container">

  <header>
    <div class="logo">METROGNOME</div>
    <div class="tagline">Song BPM &amp; Key Finder · Metronome</div>
  </header>

  <div>
    <span class="search-label">Find a Song</span>
    <div class="search-row">
      <input type="text" class="search-input" id="searchInput"
             placeholder="e.g. Bohemian Rhapsody..." autocomplete="off" />
      <button class="btn" id="searchBtn" onclick="searchSong()">Search</button>
    </div>
    <div class="status" id="searchStatus"></div>
  </div>

  <div class="song-result" id="songResult">
    <div class="song-name" id="songName">—</div>
    <div class="song-meta" id="songMeta">—</div>
  </div>

  <!-- Key display -->
  <div class="key-display" id="keyDisplay" style="display:none">
    <span class="key-label">Key</span>
    <span class="key-value" id="keyValue">—</span>
  </div>

  <div class="bpm-section">
    <div class="bpm-display" id="bpmDisplay">120</div>
    <div class="bpm-label">BPM</div>
  </div>

  <div class="bpm-controls">
    <button class="bpm-btn" onclick="adjustBpm(-5)">−</button>
    <input type="range" class="bpm-slider" id="bpmSlider"
           min="40" max="240" value="120" oninput="setBpm(this.value)">
    <button class="bpm-btn" onclick="adjustBpm(+5)">+</button>
  </div>

  <div class="beat-visualizer" id="beatVisualizer"></div>

  <span class="section-label">Time Signature</span>
  <div class="time-sig-options">
    <button class="time-btn" onclick="setTimeSig(2,this)">2/4</button>
    <button class="time-btn" onclick="setTimeSig(3,this)">3/4</button>
    <button class="time-btn active" onclick="setTimeSig(4,this)">4/4</button>
    <button class="time-btn" onclick="setTimeSig(6,this)">6/8</button>
  </div>

  <hr>

  <div class="play-section">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">Play</button>
    <button class="tap-btn" onclick="tapTempo()">Tap Tempo</button>
  </div>

</div>
<script>
  // ── CONFIG ────────────────────────────────────────────
  // After deploying your Cloudflare Worker, paste its URL here:
  const WORKER_URL = 'https://wispy-brook-2918.dragonshardxd.workers.dev';

  // Spotify pitch class → note name (C, C#, D, ...)
  const KEY_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  function getKeyName(key, mode) {
    if (key === -1) return '—';
    return KEY_NAMES[key] + (mode === 1 ? ' Major' : ' Minor');
  }

  // ── State ─────────────────────────────────────────────
  let bpm = 120, isPlaying = false, beatCount = 0, timeSig = 4;
  let intervalId = null, tapTimes = [], audioCtx = null;

  // ── Audio ─────────────────────────────────────────────
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playClick(isAccent) {
    const ctx  = getCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = isAccent ? 1200 : 800;
    osc.type = 'square';
    gain.gain.setValueAtTime(isAccent ? 0.3 : 0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.05);
  }

  // ── BPM ───────────────────────────────────────────────
  function setBpm(val) {
    bpm = Math.min(240, Math.max(40, parseInt(val)));
    document.getElementById('bpmDisplay').textContent = bpm;
    document.getElementById('bpmSlider').value = bpm;
    if (isPlaying) restartMetronome();
  }
  function adjustBpm(delta) { setBpm(bpm + delta); }

  // ── Time Signature ────────────────────────────────────
  function setTimeSig(sig, btn) {
    timeSig = sig;
    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildVisualizer();
    if (isPlaying) beatCount = 0;
  }

  function autoSetTimeSig(sig) {
    const valid = [2, 3, 4, 6];
    const s = valid.includes(sig) ? sig : 4;
    timeSig = s;
    document.querySelectorAll('.time-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.textContent) === s);
    });
    buildVisualizer();
    if (isPlaying) beatCount = 0;
  }

  // ── Visualizer ────────────────────────────────────────
  function buildVisualizer() {
    const vis = document.getElementById('beatVisualizer');
    vis.innerHTML = '';
    for (let i = 0; i < timeSig; i++) {
      const d = document.createElement('div');
      d.className = 'beat-dot' + (i === 0 ? ' accent-beat' : '');
      vis.appendChild(d);
    }
  }

  function flashBeat(idx) {
    document.querySelectorAll('.beat-dot').forEach((d,i) => d.classList.toggle('active', i === idx));
    const f = document.getElementById('flash');
    f.classList.add('beat');
    setTimeout(() => f.classList.remove('beat'), 60);
  }

  // ── Metronome ─────────────────────────────────────────
  function tick() {
    playClick(beatCount % timeSig === 0);
    flashBeat(beatCount % timeSig);
    beatCount++;
  }

  function startMetronome() { tick(); intervalId = setInterval(tick, (60/bpm)*1000); }

  function stopMetronome() {
    clearInterval(intervalId); intervalId = null; beatCount = 0;
    document.querySelectorAll('.beat-dot').forEach(d => d.classList.remove('active'));
  }

  function restartMetronome() { stopMetronome(); startMetronome(); }

  function togglePlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('playBtn');
    if (isPlaying) {
      getCtx().resume();
      startMetronome();
      btn.textContent = 'Stop';
      btn.classList.add('playing');
    } else {
      stopMetronome();
      btn.textContent = 'Play';
      btn.classList.remove('playing');
    }
  }

  // ── Tap Tempo ─────────────────────────────────────────
  function tapTempo() {
    const now = Date.now();
    tapTimes.push(now);
    if (tapTimes.length > 8) tapTimes.shift();
    if (tapTimes.length >= 2) {
      const gaps = [];
      for (let i = 1; i < tapTimes.length; i++) gaps.push(tapTimes[i] - tapTimes[i-1]);
      setBpm(Math.round(60000 / (gaps.reduce((a,b) => a+b,0) / gaps.length)));
    }
    clearTimeout(tapTimes._t);
    tapTimes._t = setTimeout(() => tapTimes = [], 2500);
  }

  // ── Song Search — via Cloudflare Worker → Spotify ─────
  async function searchSong() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;

    if (WORKER_URL.includes('YOUR_WORKER_NAME')) {
      setStatus('error', '⚠ Paste your Cloudflare Worker URL into index.html first.');
      return;
    }

    const btn = document.getElementById('searchBtn');
    btn.disabled = true;
    setStatus('', '<span class="spinner"></span>Searching Spotify...');

    try {
      const res  = await fetch(`${WORKER_URL}?q=${encodeURIComponent(query)}`);
      const data = await res.json();

      if (data.error) {
        setStatus('error', data.error === 'Song not found'
          ? 'Song not found — try adding the artist name.'
          : 'Error: ' + data.error);
        btn.disabled = false;
        return;
      }

      // Song info
      document.getElementById('songName').textContent = `${data.title} — ${data.artist}`;
      document.getElementById('songMeta').textContent = `${data.album} · via Spotify`;
      document.getElementById('songResult').classList.add('visible');

      // Key
      const keyName = getKeyName(data.key, data.mode);
      document.getElementById('keyValue').textContent = keyName;
      document.getElementById('keyDisplay').style.display = 'flex';

      // BPM + time sig
      if (data.bpm && data.bpm > 30) {
        setBpm(data.bpm);
        autoSetTimeSig(data.time_signature || 4);
        setStatus('success', `Found! ${data.bpm} BPM · ${data.time_signature || 4}/4 · ${keyName}`);
      } else {
        setStatus('', 'BPM unavailable — adjust manually.');
      }

    } catch (err) {
      console.error(err);
      setStatus('error', 'Network error — check your connection.');
    }

    btn.disabled = false;
  }

  function setStatus(type, msg) {
    const el = document.getElementById('searchStatus');
    el.className = 'status' + (type ? ' ' + type : '');
    el.innerHTML = msg;
  }

  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') searchSong();
  });

  // ── PWA ───────────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  // ── Init ──────────────────────────────────────────────
  buildVisualizer();

  if (WORKER_URL.includes('YOUR_WORKER_NAME')) {
    setStatus('error', '⚠ Add your Cloudflare Worker URL to enable song search.');
  }
</script>
</body>
</html>
